  <polygon points="52,50 106,22 160,50" fill="#E4312B"/>
  <rect x="68" y="60" width="16" height="14" rx="2" fill="#F5B014"/>
  <rect x="98" y="60" width="16" height="14" rx="2" fill="#FFF4D6"/>
  <rect x="128" y="60" width="16" height="14" rx="2" fill="#F5B014"/>
  <rect x="68" y="84" width="16" height="14" rx="2" fill="#FFF4D6"/>
