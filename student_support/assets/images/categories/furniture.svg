<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B794F6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="240" height="160" fill="url(#bg)"/>
  <circle cx="210" cy="30" r="34" fill="#FFFFFF" opacity="0.12"/>
  <!-- floor -->
  <rect x="0" y="130" width="240" height="30" fill="#4C1D95"/>
  <!-- desk -->
  <rect x="100" y="78" width="110" height="10" rx="3" fill="#F5B014"/>
  <rect x="106" y="88" width="8" height="44" fill="#C98A00"/>
  <rect x="196" y="88" width="8" height="44" fill="#C98A00"/>
  <rect x="150" y="88" width="40" height="22" rx="2" fill="#FFD369"/>
  <circle cx="170" cy="99" r="2.5" fill="#6D28D9"/>
  <!-- laptop on desk -->
  <rect x="120" y="58" width="34" height="20" rx="2" fill="#0B2A5B"/>
  <rect x="124" y="62" width="26" height="13" fill="#5FD3FF"/>
  <!-- broken chair, tilted -->
  <g transform="rotate(-12 60 110)">
    <rect x="34" y="56" width="10" height="56" rx="3" fill="#FFFFFF"/>
    <rect x="34" y="56" width="44" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="34" y="96" width="50" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="36" y="106" width="7" height="26" fill="#E9E1FF"/>
    <!-- snapped leg -->
    <rect x="76" y="106" width="7" height="12" fill="#E9E1FF"/>
  </g>
  <rect x="78" y="126" width="18" height="6" rx="2" fill="#E9E1FF" transform="rotate(30 87 129)"/>
  <!-- crack lines -->
  <polyline points="74,108 80,114 76,118" fill="none" stroke="#E4312B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- warning badge -->
  <circle cx="60" cy="34" r="14" fill="#E4312B"/>
  <rect x="57.5" y="25" width="5" height="12" rx="2.5" fill="#FFFFFF"/>
  <circle cx="60" cy="42" r="2.6" fill="#FFFFFF"/>
</svg>
